plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.linhvu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
	set('springCloudVersion', "2025.1.2")
	set('springCloudAwsVersion', "4.1.0")
	set('springModulithVersion', "2.1.0")
	set('togglzVersion', "4.6.2")
	set('flociTestcontainersVersion', "2.13.0")
}

sourceSets {
	seed {
		// KHÔNG khai báo `java.srcDir 'src/seed/java'` / `resources.srcDir
		// 'src/seed/resources'`: Gradle đã tự gán đúng hai thư mục đó cho source
		// set tên `seed`, nên khai thêm là đăng ký TRÙNG. Java compile không kêu,
		// nhưng `processSeedResources` thì chết bằng "Entry … is a duplicate" ngay
		// khi seed có file resource đầu tiên — tức là ở Task 25, cách chỗ gây lỗi
		// rất xa.
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	seedImplementation.extendsFrom implementation
	seedRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
//	implementation 'org.springframework.boot:spring-boot-starter-actuator'
//	implementation 'org.springframework.boot:spring-boot-starter-batch'
//	implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
//	implementation 'org.springframework.boot:spring-boot-starter-data-cassandra'
//	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
//	implementation 'org.springframework.boot:spring-boot-starter-flyway'
//	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
//	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
//	implementation 'org.springframework.boot:spring-boot-starter-websocket'
//	implementation 'org.flywaydb:flyway-database-postgresql'
//	implementation 'org.jobrunr:jobrunr-spring-boot-4-starter:8.7.0'
//	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
//	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
//	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
//	implementation 'org.springframework.modulith:spring-modulith-observability-api'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
//	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-dynamodb'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs'
	implementation "org.togglz:togglz-spring-boot-starter:${togglzVersion}"
	implementation "org.togglz:togglz-dynamodb:${togglzVersion}"
	// KHÔNG ghim version: BOM của Boot quản. Kéo theo woodstox-core + stax2-api.
	implementation 'tools.jackson.dataformat:jackson-dataformat-xml'

	// Source set `seed` đã extendsFrom implementation, nên mấy dòng này là THỪA
	// về mặt resolve. Giữ tường minh vì `seed` không đi qua Spring: nếu sau này
	// ứng dụng bỏ webmvc (kéo theo Jackson) hay đổi starter DynamoDB, seed sẽ
	// vỡ lúc compile ở đây thay vì lặng lẽ mất dependency.
	//
	// Danh sách này phải soi gương thứ `seed` THẬT SỰ dùng, nếu không nó thành
	// lời khai sai và mất hẳn tác dụng cảnh báo. Task 7 đổi cả ba:
	// `jackson-databind` và `dynamodb-enhanced` đi theo `ArticleFixtures` /
	// `SeedApplication`; `SourcesSyncApplication` đọc YAML và dùng client
	// low-level.
	seedImplementation 'org.yaml:snakeyaml'
	seedImplementation 'software.amazon.awssdk:dynamodb'
	// KHÔNG có dòng code nào `import` gói này — nó được nạp bằng phản chiếu, nên
	// thiếu nó thì compile vẫn xanh và chỉ chết lúc chạy thật.
	//
	// `sourcesSync` chạy bằng profile của người vận hành, mà cả ba profile
	// `na-dev`/`na-qa`/`na-prod` đều là ROLE-ASSUMING (`role_arn` +
	// `source_profile`). `ProfileCredentialsProvider` chỉ resolve được dạng đó khi
	// module `sts` có mặt; không có thì nó lặng lẽ bỏ qua profile và chuỗi provider
	// chạy tiếp tới hết, kết thúc bằng "Unable to load credentials from any of the
	// providers in the chain" — một câu KHÔNG hề nhắc tới `sts` và trỏ sai hướng
	// hoàn toàn (lý do thật nằm lẫn giữa sáu dòng con). Đã trả giá thật 2026-08-06.
	//
	// CHỈ ở `seed`, không thêm vào `implementation`: Lambda lấy credential từ
	// container provider chứ không qua profile, nên `sts` ở đó là cân nặng thừa
	// trong image.
	seedImplementation 'software.amazon.awssdk:sts'

//	runtimeOnly 'org.postgresql:postgresql'
//	runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
//	runtimeOnly 'org.springframework.modulith:spring-modulith-observability-core'
	runtimeOnly 'org.springframework.modulith:spring-modulith-runtime'

//	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-batch-jdbc-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-data-cassandra-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
//	testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
//	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
//	testImplementation 'org.testcontainers:testcontainers-cassandra'
//	testImplementation 'org.testcontainers:testcontainers-grafana'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
//	testImplementation 'org.testcontainers:testcontainers-ollama'
//	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation "io.floci:spring-boot-testcontainers-floci:${flociTestcontainersVersion}"
	testImplementation "org.togglz:togglz-junit:${togglzVersion}"

	// Task 7 gỡ `testImplementation sourceSets.seed.output`: `ArticleFixtures` và
	// `fixtures/articles.json` đã về `src/test`, nên test không còn cần gì của
	// seed. Hệ quả CỐ Ý: `SourcesSyncApplication` nằm NGOÀI tầm với của test —
	// xem ⚠️ ở khối `sourcesSync` bên dưới.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()

	// `src/seed` KHÔNG có gì kéo nó vào build graph nữa. Trước Task 7 nó được
	// `testImplementation sourceSets.seed.output` kéo vào gián tiếp; Task 7 gỡ
	// dòng đó, và hệ quả kèm theo — đã đo: `./gradlew build` BUILD SUCCESSFUL
	// với file Java sai cú pháp nằm trong `src/seed` — là seed rơi khỏi mọi
	// đường kiểm. CI chạy `./gradlew test` nên móc vào đây, không phải `check`.
	dependsOn 'compileSeedJava'
}

// ⚠️ `seed` KHÔNG nằm trên test classpath, nên `SourcesSyncApplication` không có
// test tự động nào — kể cả tính chất quan trọng nhất của nó là "UpdateItem chứ
// không PutItem, để etag của lượt fetch trước sống sót qua mỗi lần đồng bộ".
// Đổi nó sang PutItem sẽ vô hiệu conditional GET của slice 4 mà mọi test vẫn
// xanh. Chốt chặn hiện tại là bước kiểm tay trong runbook Phase 2
// §"sourcesSync — kiểm chứng UpdateItem".
tasks.register('sourcesSync', JavaExec) {
	group = 'application'
	description = 'Đồng bộ sources.yaml vào bảng sources của môi trường đích'
	classpath = sourceSets.seed.runtimeClasspath
	mainClass = 'dev.linhvu.seed.SourcesSyncApplication'
}

tasks.named('bootBuildImage') {
	imageName = 'news-aggregator:local'
	builder = 'paketobuildpacks/builder-noble-java-tiny:latest'
	environment = [
			'BP_JVM_VERSION'         : '25',
			// Disabled due to paketo-buildpacks/spring-boot#581 (Java 25 + Boot 4):
			// "unable to contribute spring-performance layer". Master §8.2 accepts
			// the cold start, so this is a valid baseline. Re-enable when the issue
			// is fixed — see ADR-0008 §8.
			'BP_JVM_AOTCACHE_ENABLED': 'false'
	]
}
