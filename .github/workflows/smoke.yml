name: Smoke

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      site_url:
        required: true
        type: string
      function_url:
        required: true
        type: string
      # Cùng lý do như function_url bên dưới: cả hai đều là biến ENVIRONMENT-SCOPED,
      # nên chúng phải đi vào đây bằng INPUT chứ không đọc `vars.*` tại chỗ.
      smoke_role:
        required: true
        type: string
      function_name:
        required: true
        type: string
      expected_commit:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write     # MỚI — không có dòng này thì configure-aws-credentials
                      # thất bại với "Could not load credentials", một thông báo
                      # không hề gợi ý rằng nguyên nhân là permission của workflow

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    steps:
      # Lambda tối ưu image sau khi cập nhật; trong lúc đó function ở trạng
      # thái Pending và request đầu sẽ lỗi. Retry có backoff là bắt buộc,
      # không phải phòng xa.
      - name: Chờ /api/health trả 200
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' \
              "${{ inputs.site_url }}/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "OK sau $i lần thử"; cat /tmp/health.json; exit 0
            fi
            echo "lần $i: HTTP $code, chờ 15s"; sleep 15
          done
          echo "::error::[${{ inputs.environment }}] /api/health không trả 200 sau 20 lần thử"; exit 1

      - name: Xác nhận đúng commit vừa deploy
        if: inputs.expected_commit != ''
        run: |
          actual=$(jq -r '.commit' /tmp/health.json)
          if [ "$actual" != "${{ inputs.expected_commit }}" ]; then
            echo "::error::[${{ inputs.environment }}] commit không khớp — mong đợi ${{ inputs.expected_commit }}, nhận $actual"
            echo "Nguyên nhân thường gặp: /api/* đang bị CloudFront cache."
            exit 1
          fi

      # Layer 7 tồn tại chính vì những khẳng định dưới đây KHÔNG kiểm chứng
      # được ở local: emulator không cưỡng chế IAM và không có CloudFront.
      #
      # function_url phải là INPUT, không được đọc `vars.FUNCTION_URL` ở đây.
      # Job này không có `environment:` nên `vars` chỉ thấy biến cấp repository,
      # mà FUNCTION_URL là environment-scoped. Thêm `environment:` vào đây cũng
      # không phải lời giải: prod có required reviewers, job sẽ chờ approval lần
      # thứ hai sau khi đã approve lần deploy. Job deploy (vốn đã có
      # `environment:`) đọc hộ rồi truyền xuống qua output.
      - name: Function URL trực tiếp phải trả 403
        run: |
          url="${{ inputs.function_url }}"
          [ -z "$url" ] && { echo "::error::[${{ inputs.environment }}] function_url rỗng — job deploy chưa xuất output, hoặc environment này thiếu vars.FUNCTION_URL"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          [ "$code" = "403" ] || { echo "::error::[${{ inputs.environment }}] Function URL trả $code, phải 403"; exit 1; }

      - name: /api/* không được cache
        run: |
          hdr=$(curl -sI "${{ inputs.site_url }}/api/health" | tr -d '\r')
          echo "$hdr" | grep -qi 'x-cache: *Hit' \
            && { echo "::error::[${{ inputs.environment }}] /api/* đang bị cache"; exit 1; } || true

      # `required: true` của workflow_call KHÔNG bắt được chuỗi rỗng — job gọi
      # vẫn truyền xuống được một biến chưa ai đặt. Kiểm ở đây để lỗi nói đúng
      # nguyên nhân, thay vì để configure-aws-credentials chết bằng
      # "Could not assume role with OIDC" ở bước sau.
      - name: Xác nhận input của đường scheduled không rỗng
        run: |
          [ -n "${{ inputs.smoke_role }}" ] || { echo "::error::[${{ inputs.environment }}] smoke_role rỗng — environment này thiếu vars.AWS_SMOKE_ROLE"; exit 1; }
          [ -n "${{ inputs.function_name }}" ] || { echo "::error::[${{ inputs.environment }}] function_name rỗng — environment này thiếu vars.LAMBDA_NAME"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.smoke_role }}
          aws-region: us-east-1

      # Đường scheduled KHÔNG kiểm được bằng curl: không có URL public nào dẫn
      # tới nó, và đó là thiết kế chứ không phải thiếu sót. Invoke trực tiếp là
      # cách duy nhất để máy trả lời "pass-through có chạy không".
      - name: Invoke đường scheduled qua LWA pass-through
        run: |
          aws lambda invoke \
            --function-name "${{ inputs.function_name }}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"job":"ingest-feeds"}' \
            /tmp/ingest.json > /tmp/meta.json
          cat /tmp/meta.json
          cat /tmp/ingest.json
          # FunctionError xuất hiện khi hàm ném exception. Lambda vẫn trả HTTP 200
          # cho lời gọi invoke, nên KHÔNG kiểm được bằng exit code của aws-cli.
          if grep -q FunctionError /tmp/meta.json; then
            echo "::error::[${{ inputs.environment }}] lượt ingestion ném lỗi"; exit 1
          fi
          jq -e 'has("discovered") and has("added") and has("failed")' /tmp/ingest.json \
            || { echo "::error::[${{ inputs.environment }}] response không đúng hình dạng IngestResult"; exit 1; }
