plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awscdk:aws-cdk-lib:2.262.2'
    implementation 'software.constructs:constructs:10.8.0'
    implementation 'io.github.cdklabs:cdknag:3.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.linhvu.news_aggregator.infra.NewsAggregatorApp'
}

/**
 * Test của handler `account-linking`, chạy bằng test runner có sẵn của Node.
 *
 * Không `package.json`, không `node_modules`, không bundler: logic nằm ở
 * `linking.mjs` và KHÔNG import AWS SDK (runtime `nodejs22.x` cấp sẵn SDK, còn
 * ở đây thì không cần vì test tiêm client giả).
 *
 * Treo vào `test` chứ không để thành một task rời: CI gọi `./gradlew test` và
 * chỉ thế thôi — một task phải nhớ gọi tay là một task sẽ không được gọi.
 */
def lambdaTest = tasks.register('lambdaTest', Exec) {
    group = 'verification'
    description = 'node --test cho handler account-linking'
    workingDir = file('lambda/account-linking')
    commandLine 'node', '--test'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn lambdaTest
}