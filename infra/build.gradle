plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awscdk:aws-cdk-lib:2.262.2'
    implementation 'software.constructs:constructs:10.8.0'
    implementation 'io.github.cdklabs:cdknag:3.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.linhvu.news_aggregator.infra.NewsAggregatorApp'
}

tasks.named('test') {
    useJUnitPlatform()
}