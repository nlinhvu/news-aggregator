# Danh sách nguồn là CẤU HÌNH, không phải fixture: nó có lịch sử git và đi qua
# review. Trạng thái runtime (etag, lastModified, lastFetchedAt) KHÔNG nằm ở
# đây — sourcesSync dùng UpdateItem nên nó không bao giờ đụng tới.
#
# Checklist bắt buộc khi THÊM một nguồn:
#   1. curl -A 'NewsAggregator/1.0 (+https://news.linhvu.dev)' <feedUrl> → phải 200
#   2. Kiểm robots.txt của host cho phép (master §8.4 — Phase 2 kiểm tay, Phase 5 mới có bản runtime)
#   3. Ghi lại root element THẬT, đừng tin đuôi URL hay Content-Type
sources:
  - sourceId: spring-blog
    name: Spring Blog
    # Đo lại 2026-08-06: 200, robots.txt `Allow: /`. Đuôi .atom và header
    # `application/atom+xml`, nhưng thân là <rss version="2.0">. Đây CHÍNH LÀ
    # lý do slice 2 chọn nguồn này.
    #
    # Nguồn này phát `ETag` nhưng KHÔNG phát `Last-Modified` — tức lượt fetch
    # đầu tiên của slice 4 rơi thẳng vào nhánh SET-etag + REMOVE-lastModified
    # của `SourceRepository.updateFetchState`. Nhánh đó có test riêng
    # (`record_fetch_set_va_remove_trong_cung_mot_luot`), không phải trường
    # hợp giả định.
    feedUrl: https://spring.io/blog.atom
    enabled: true

  - sourceId: aws-news
    name: AWS News Blog
    # Đo 2026-08-06: 200, root THẬT `<rss version="2.0">` (khai đúng
    # `application/rss+xml` — nguồn duy nhất khai đúng).
    #
    # robots.txt của host CÓ `Disallow: /blogs/`, nhưng nó nằm trong nhóm
    # `User-agent: AdsBot-Google`, KHÔNG phải nhóm `*`. Đừng đọc bằng mắt rồi
    # kết luận là bị chặn: kiểm bằng parser thật (`urllib.robotparser`) với
    # đúng UA của chương trình → ALLOW, còn UA `AdsBot-Google` → DENY.
    #
    # Chỉ phát `Last-Modified`, KHÔNG có `ETag` — đối xứng ngược với Spring
    # Blog ở trên, nên slice 4 có cả hai nhánh của `updateFetchState` được một
    # nguồn thật đi qua chứ không chỉ test.
    feedUrl: https://aws.amazon.com/blogs/aws/feed/
    enabled: true

  - sourceId: infoq-java
    name: InfoQ Java
    # Đo 2026-08-06: 200, root THẬT `<rss>` dù khai `application/xml`.
    #
    # `feed.infoq.com/robots.txt` trả 406 — 4xx nghĩa là không có hạn chế
    # (RFC 9309 §2.3.1.3). KHÔNG lấy `www.infoq.com/robots.txt` thay: đó là
    # host khác, và nó đang nằm sau AWS WAF captcha nên cũng chẳng đọc được.
    #
    # Phát cả `ETag` lẫn `Last-Modified` — nhưng ⚠️ **PHỚT LỜ cả hai**. Đo
    # 2026-08-06 (Task 16): ETag ổn định qua ba lượt liên tiếp
    # (`"1786018120483"`), vậy mà gửi lại `If-None-Match`, hoặc
    # `If-Modified-Since`, hoặc cả hai, đều nhận 200 kèm body đầy đủ. Ba nguồn
    # kia trả 304 với đúng cách gửi đó.
    #
    # KHÔNG phải lỗi phía mình, và đừng "sửa": nguồn này chỉ đơn giản không
    # implement conditional GET. Hệ quả là mỗi lượt ingestion luôn tải full
    # InfoQ — chi phí băng thông, không ảnh hưởng tính đúng.
    #
    # Nguồn THẬT đầu tiên gắn `?utm_campaign=…&utm_source=…&utm_medium=…` vào
    # mọi link. Tới trước nó, `CanonicalUrl.stripTracking` chỉ được test gọi;
    # từ đây nó nằm trên đường chạy thật, và nếu nó hỏng thì triệu chứng là
    # bài InfoQ nhân bản mỗi lần feed đổi tham số.
    feedUrl: https://feed.infoq.com/java/
    enabled: true

  - sourceId: inside-java
    name: Inside Java
    # Đo 2026-08-06: 200, root THẬT `<feed>` (Atom) dù khai `application/xml`
    # — nguồn Atom đầu tiên, và là lý do Task 14 tồn tại.
    #
    # `inside.java/robots.txt` trả 404 (kèm trang HTML 404, đừng nhầm là nội
    # dung robots) — 4xx nghĩa là không có hạn chế.
    #
    # Phát cả `ETag` lẫn `Last-Modified`.
    feedUrl: https://inside.java/feed.xml
    enabled: true

  - sourceId: jetbrains-blog
    name: JetBrains Blog
    # Đo 2026-08-11: 200, root THẬT `<rss version="2.0">` và khai đúng
    # `application/rss+xml` — nguồn thứ hai khai đúng, sau AWS.
    #
    # `blog.jetbrains.com/robots.txt` 200, nhóm `*` chỉ có `Disallow: /wp-admin/`
    # → `/feed/` ALLOW (kiểm bằng `urllib.robotparser` với đúng UA của chương
    # trình, không đọc bằng mắt).
    #
    # Phát cả `ETag` lẫn `Last-Modified`, và conditional GET CHẠY THẬT: gửi
    # `If-None-Match`, `If-Modified-Since`, hay cả hai đều nhận 304 — ngược hẳn
    # InfoQ.
    #
    # ⚠️ ETag là giá trị của CẢ HOST, không riêng feed này: gửi etag của
    # `/feed/` cho `/kotlin/feed/` vẫn nhận 304 dù hai body khác nhau (129 KB so
    # với 184 KB, channel title khác). Không sai — token đổi khi bất kỳ đâu trên
    # host đổi, nên 304 vẫn kéo theo "feed này không đổi". Nhưng thêm feed con
    # thứ hai của cùng host thì mỗi bài đăng ở BẤT KỲ đâu sẽ làm mọi feed con
    # tải full một lượt. Tốn băng thông, không ảnh hưởng tính đúng.
    #
    # Nguồn đầu tiên mà MỌI item đều có `content:encoded` (12/12): excerpt sau
    # khi strip ngắn nhất 918 ký tự, median chạm trần `max-excerpt-chars` 2000,
    # không item nào dưới ngưỡng 200 của `min-excerpt-chars`. Tức mọi bài của
    # nguồn này đều đủ điều kiện tóm tắt — khác Phase 2, nơi nguồn có thể cho
    # excerpt quá ngắn.
    #
    # ⚠️ Một item có `<title>` là ĐÚNG MỘT ký tự U+00A0 (non-breaking space):
    # `/qodana/2026/08/alexey-gopachenko/`. `IngestionRunner.publish` chỉ validate
    # link và date, KHÔNG validate title, nên bài đó vào bảng với tiêu đề trống và
    # hiện lên trang như vậy. Đã cân nhắc và CHẤP NHẬN: đó là dữ liệu thật của
    # nguồn. Thấy một tiêu đề trống trên trang thì đây là lý do, không phải bug
    # parser.
    #
    # Nội dung trộn nhiều hệ sinh thái (.NET, Rust, Go, WebStorm) — chỉ 2/12 bài
    # dính Java. Đây là nguồn RỘNG nhất trong danh sách; nếu muốn hẹp về JVM thì
    # `https://blog.jetbrains.com/kotlin/feed/` là feed cùng host, cùng hình dạng.
    feedUrl: https://blog.jetbrains.com/feed/
    enabled: true

# Baeldung ĐÃ BỊ LOẠI — trả 403 với `User-Agent` định danh của chương trình
# (đo 2026-08-05). Không đổi UA để lách; xem TDD §17 #18.
