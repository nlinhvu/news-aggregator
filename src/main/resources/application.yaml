spring:
  application:
    name: news-aggregator
  cloud:
    aws:
      region:
        static: us-east-1

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          # Boot 4.1 KHÔNG có endpoint mặc định. Không set thì bean
          # `OtlpTracingConnectionDetails` không được dựng (`@ConditionalOnProperty`
          # trên chính key này), kéo theo không có exporter — span sinh ra rồi chết
          # trong bộ nhớ, không một dòng log nào nói ra. Mặc định trỏ local để
          # `./gradlew bootRun` chạy được ngay trên host; compose và prod đè bằng
          # env var (Task 16).
          #
          # TÊN KEY: bản Boot 3 là `management.otlp.tracing.endpoint`, đã deprecate
          # ở mức `error` — viết tên cũ thì cấu hình bị BỎ QUA lặng lẽ, tức rơi
          # đúng vào chế độ hỏng vừa tả.
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        # Starter kéo theo `micrometer-registry-otlp`, và registry đó BẬT SẴN với
        # url mặc định `localhost:4318/v1/metrics` — mỗi phút một POST vào chỗ
        # không tồn tại khi chạy trên Lambda. Metric của hệ này đi bằng metric
        # filter trên log (Task 11), không đi bằng OTLP.
        enabled: false
  logging:
    export:
      otlp:
        # Cùng lý do: log đi stdout dạng ECS JSON rồi vào CloudWatch. Dòng này còn
        # là chốt chặn cho env var `OTEL_EXPORTER_OTLP_ENDPOINT` dạng CHUNG —
        # Boot 4.1 map nó vào cả ba endpoint trace/metric/log cùng lúc.
        enabled: false
  tracing:
    sampling:
      # 100%, VIẾT RA TƯỜNG MINH chứ không để mặc định trôi vào (mặc định của Boot
      # là 0.1). Ở khối lượng này (~3.000 trace/tháng trên free tier 100.000) đây
      # là lựa chọn đúng; ở mọi khối lượng lớn hơn nó SAI, và tài liệu ADOT gọi
      # mặc định `parentbased_always_on` là bẫy hoá đơn ("up to 20x higher
      # ingestion volume"). Ngưỡng hạ xuống 5–10%: ~8.000 trace/tháng.
      #
      # Đây là tầng lấy mẫu THỨ NHẤT trong hai tầng, và cả hai đều viết là `1.0`
      # với ý nghĩa lệch nhau hai bậc độ lớn:
      #   ở đây          `1.0` = 100%  (tỉ lệ)   ⇒ span vào `aws/spans`, Transaction
      #                                            Search thấy TẤT CẢ
      #   indexing rule  `1.0` = 1%    (phần trăm) ⇒ trace summary, X-Ray → Traces
      #                                            và service map chỉ thấy 1%
      # Nên "có span mà X-Ray Traces rỗng" là số học, không phải hỏng hóc — xem plan
      # Phase 4 Task 16 Step 11. Hạ giá trị dưới đây là siết tầng MỘT; nó không đụng
      # tới tầng hai, và ngược lại.
      probability: 1.0

news:
  commit-sha: ${NEWS_COMMIT_SHA:local}
  platform:
    # PHẢI khớp AWS_LWA_PASS_THROUGH_PATH trong AppStack. Không nằm dưới /api/*,
    # nếu không CloudFront sẽ route tới và đường vào nội bộ thành public.
    pass-through-path: /events
  catalog:
    table-name: ${NEWS_ARTICLES_TABLE:articles}
    default-limit: 20
    max-limit: 100
  togglz:
    table-name: ${NEWS_TOGGLES_TABLE:feature-toggles}
  sources:
    table-name: ${NEWS_SOURCES_TABLE:sources}
  personalization:
    # Khai TRƯỚC module `personalization` (Task 23) vì fixture test T2 và
    # `AppStack` đã dựng bảng từ Task 19 — cấu hình phải có mặt trước đoạn code
    # đọc nó, không phải cùng lúc.
    preferences-table: ${NEWS_PREFERENCES_TABLE:user-preferences}
  identity:
    sessions-table: ${NEWS_SESSIONS_TABLE:sessions}
    # `false` ở đây là cho LOCAL (`http://localhost`), nơi trình duyệt vứt bỏ
    # cookie `Secure`. Trên AWS, `application-aws.yaml` bật nó lên `true` — và
    # BẮT BUỘC phải bật tường minh như vậy: sau CloudFront → Function URL → LWA,
    # request tới Tomcat là HTTP trần, nên cơ chế mặc định của Spring
    # (`request.isSecure()`) kết luận "không HTTPS" và bỏ `Secure` đi. Đã đo trên
    # prod 2026-08-13 — xem `CookieSecurityIT`.
    secure-cookies: false
    # Domain CÔNG KHAI của site, và app KHÔNG suy ra được nó từ request:
    # CloudFront đi tới Function URL bằng `ALL_VIEWER_EXCEPT_HOST_HEADER`, tức
    # `Host` của viewer bị strip có chủ ý (SigV4 đòi Host của Function URL).
    # Mọi URL tuyệt đối — redirect đăng nhập, `redirect_uri` gửi Cognito — phải
    # dựng từ đây. `AppStack` bơm biến này bằng CHÍNH `cfg.appDomain()` mà
    # `IdentityStack` dùng cho `callbackUrls`.
    public-base-url: ${NEWS_PUBLIC_BASE_URL:http://localhost:8080}
    cognito:
      # Bốn biến này CHỈ được `AppStack` bơm vào `web` (và sau này `admin`) —
      # `ingest`/`summarize` không có bề mặt đăng nhập nào. Giá trị mặc định ở
      # đây phục vụ `./gradlew bootRun` trên host; Task 12 dựng mock-oauth2-server
      # ở đúng cổng 8090.
      issuer-uri: ${NEWS_COGNITO_ISSUER_URI:http://localhost:8090/cognito}
      client-id: ${NEWS_COGNITO_CLIENT_ID:news-local}
      secret-parameter: ${NEWS_COGNITO_SECRET_PARAMETER:/news/local/cognito-client-secret}
      logout-uri: ${NEWS_COGNITO_LOGOUT_URI:http://localhost:8090/cognito/logout}
    # 30 ngày, TRƯỢT theo mỗi lần dùng. Soi gương thời hạn mặc định của refresh
    # token Cognito — hai con số lệch nhau nghĩa là phiên còn sống nhưng không
    # làm mới được token, một trạng thái không ai gỡ được từ phía người dùng.
    session-ttl: 30d
  ingestion:
    user-agent: ${NEWS_USER_AGENT:NewsAggregator/1.0 (+https://news.linhvu.dev)}
    connect-timeout: 5s
    read-timeout: 10s
    max-concurrency: 8
    max-body-bytes: 5242880
  summarization:
    # Dưới ngưỡng này thì excerpt không đủ cho model làm việc — bài vẫn vào bảng,
    # chỉ là không có tóm tắt.
    min-excerpt-chars: 200
    max-excerpt-chars: 2000
    max-per-run: 25
    # Cửa sổ sweep. Bài rơi ra ngoài không bao giờ được nhặt lại — đó là cơ chế
    # chặn rò rỉ chi phí của ADR-0014, không phải thiếu sót. Mở rộng cho MỘT lượt
    # bằng payload `sinceHours`, không phải bằng deploy.
    sweep-window: 48h
    queue-url: ${NEWS_SUMMARIZE_QUEUE_URL:http://localhost:4566/000000000000/summarize-queue}
    # Escape hatch local: có giá trị thì THẮNG và SSM không bị chạm.
    api-key: ${GOOGLE_API_KEY:}
    key-parameter: ${NEWS_GEMINI_KEY_PARAMETER:/news/local/gemini-api-key}
    # Cùng model ở CẢ BỐN môi trường; dev/qa/local chạy trên free tier của chính
    # nó (master §8.3, sửa 2026-08-10). Đây là parity mà Phase 3 ĐÒI LẠI.
    #
    # Giá trị này phải khớp `AppStack` — xem lý do ghim phiên bản ở đó. Bản trước
    # (`gemini-2.5-flash-lite`) bị Google ngưng ngày 2026-08-11 và trả 404.
    model: ${NEWS_SUMMARIZATION_MODEL:gemini-3.5-flash-lite}
    # Tóm tắt cần ổn định, không cần sáng tạo.
    temperature: 0.2
    call-timeout: 25s
    # Nới 400 → 500 để trả nợ Phase 3 §20B #6: model trả 410 ký tự bị vứt cả lời
    # gọi, retry cho ra 337 và được nhận — trả tiền hai lần vì lố 2,5%. Prompt xin
    # "tối đa 60 từ", mà 60 từ tiếng Việt vượt 400 ký tự một cách bình thường, nên
    # 400 nằm ngay giữa vùng đầu ra HỢP LỆ chứ không phải ngoài rìa nó. Trần vẫn
    # tồn tại để chặn chế độ hỏng THẬT mà nó sinh ra để chặn: model phớt lờ prompt
    # và chép lại gần trọn bài. Chốt chặn của dòng này là
    # `SummarizerWiringTest#tran_do_dai_cau_hinh_la_500` — không test nào khác đọc
    # tới nó.
    max-summary-chars: 500
    # Thứ thay thế circuit breaker (TDD §17 #8). Gemini hỏng hàng loạt thì 10 bài
    # × 25s timeout vượt 120s function timeout, invoke chết trước khi kịp trả
    # `batchItemFailures`, và CẢ batch quay lại — kể cả bài đã tóm tắt xong.
    consecutive-failure-limit: 3

togglz:
  feature-enums: dev.linhvu.news_aggregator.platform.NewsFeature
  console:
    enabled: true
    # Nằm dưới `/admin/*` để CloudFront route sang function `admin` (origin thứ
    # ba, Task 26) và để `SecurityConfig` khoá nó bằng MỘT dòng
    # `requestMatchers("/admin/**").hasAuthority("ROLE_ops")`.
    path: /admin/togglz
    # Phân quyền là việc của Spring Security, KHÔNG phải của Togglz. Để `true`
    # thì `TogglzConsoleServlet` tự kiểm `UserProvider.isFeatureAdmin()`, mà
    # `UserProvider` của ta là `NoOpUserProvider` (xem `TogglzConfig`) nên nó
    # sẽ chặn SẠCH mọi người — kể cả nhóm `ops`. Hai cổng chồng nhau, cổng thứ
    # hai luôn đóng.
    secured: false
    # `use-management-port` mặc định `true` trong `TogglzProperties`, nhưng
    # `@ConditionalOnProperty(havingValue="false", matchIfMissing=true)` khiến
    # console vẫn đăng ký trên cổng ứng dụng khi property VẮNG MẶT. Khai tường
    # minh `false` để hành vi không phụ thuộc vào sự khác nhau giữa "giá trị
    # mặc định của bean" và "matchIfMissing của condition".
    use-management-port: false
    # CSRF do Spring Security lo, KHÔNG do Togglz — và đây là quyết định về
    # KIẾN TRÚC, không phải về sở thích.
    #
    # `TogglzCSRFTokenCache` là một `PassiveExpiringMap` STATIC trong JVM với
    # TTL 10 phút. Trên Lambda, token phát ra ở execution environment này không
    # có trong cache của environment kia, nên lượt POST lật flag chết bằng một
    # trang lỗi 401 mỗi khi nó rơi vào instance khác — một lỗi ngắt quãng,
    # không tái hiện được, và không log nào của ta nói tới.
    #
    # Thay vào đó `SpringCsrfTokenProvider` đưa token của Spring Security vào
    # đúng form ấy: token nằm trong cookie `XSRF-TOKEN` nên nó KHÔNG phụ thuộc
    # instance, và nó là cùng một cơ chế mà `/api/**` đã dùng.
    validate-csrf-token: false
