services:
  floci:
    image: 'floci/floci:latest'
    ports:
      - '4566:4566'
    environment:
      - 'FLOCI_DEFAULT_REGION=us-east-1'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_floci/init']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ['lambda']
    build: .
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_PROFILES_ACTIVE=local'
      - 'NEWS_COMMIT_SHA=local-compose'
      # application-local.yaml trỏ localhost:4566 để ./gradlew bootRun chạy được trên host.
      # Trong compose, localhost là chính container app — phải trỏ sang service floci.
      - 'SPRING_CLOUD_AWS_ENDPOINT=http://floci:4566'
    depends_on:
      floci:
        condition: service_healthy
