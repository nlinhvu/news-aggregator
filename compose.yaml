services:
  floci:
    image: 'floci/floci:latest'
    ports:
      - '4566:4566'
    environment:
      - 'FLOCI_DEFAULT_REGION=us-east-1'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_floci/init']
      interval: 5s
      timeout: 3s
      retries: 20

  otel-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'   # Grafana UI
      - '4317:4317'   # OTLP gRPC
      - '4318:4318'   # OTLP HTTP
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # IdP local. Floci KHÔNG thay được nó: Cognito của Floci không có
  # `/oauth2/authorize`, và `/oauth2/token` của nó chỉ nhận `client_credentials`.
  #
  # Image và JSON_CONFIG phải KHỚP `MockOAuth2ServerConfiguration` bên test —
  # lệch nhau là local và CI kiểm hai thứ khác nhau.
  mock-oauth2-server:
    image: 'ghcr.io/navikt/mock-oauth2-server:4.0.1'
    ports:
      - '8090:8080'
    environment:
      # `interactiveLogin` bật màn hình đăng nhập thật, nên luồng ở local là
      # CÙNG MỘT `oauth2Login()` với prod — chỉ khác issuer.
      #
      # `requestParam` phải là `grant_type`: token request của luồng
      # authorization code KHÔNG mang `scope`, nên mapping theo `scope` không
      # bao giờ khớp và hai claim dưới đây lặng lẽ không được phát. Claim
      # `cognito:groups` phải có, nếu không cổng `ops` của slice 5 không kiểm
      # được ở local và ta chỉ phát hiện nó hỏng trên `dev`.
      - >-
        JSON_CONFIG={"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"cognito",
        "tokenExpiry":3600,"requestMappings":[{"requestParam":"grant_type",
        "match":"authorization_code",
        "claims":{"cognito:groups":["ops"],"email":"dev@local"}}]}]}
    # `wget` chứ không `curl`: image này KHÔNG có curl, và Docker không phân biệt
    # "lệnh không tồn tại" với "server hỏng" — cả hai đều là exit khác 0. Server
    # trả 200 mà service vẫn `unhealthy` mãi mãi, nên `depends_on` bên dưới đứng
    # đủ `retries × interval` (đo được 102 giây) rồi bỏ cuộc bằng một lỗi không
    # nhắc gì tới `curl`. Xem TS-0004.
    #
    # `-O /dev/null` chứ không `--spider`: `--spider` gửi HEAD, và endpoint
    # discovery trả 405 cho HEAD.
    #
    # `-t 1` tắt retry của wget. Để mặc định (20 lần) thì một lượt kiểm chạy lâu
    # hơn `timeout: 3s` rất nhiều, và Docker giết nó giữa chừng — kết quả là
    # `unhealthy` vì hết giờ chứ không vì server hỏng.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '2', '-t', '1',
             'http://localhost:8080/cognito/.well-known/openid-configuration']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ['lambda']
    build: .
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_PROFILES_ACTIVE=local'
      - 'NEWS_COMMIT_SHA=local-compose'
      # application-local.yaml trỏ localhost:4566 để ./gradlew bootRun chạy được trên host.
      # Trong compose, localhost là chính container app — phải trỏ sang service floci.
      - 'SPRING_CLOUD_AWS_ENDPOINT=http://floci:4566'
      # Cùng lý do như dòng trên, cho endpoint OTLP trong application.yaml.
      - 'MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-lgtm:4318/v1/traces'
      # Trong compose, `localhost` là chính container app.
      - 'NEWS_COGNITO_ISSUER_URI=http://mock-oauth2-server:8080/cognito'
      # Trình duyệt ở HOST gọi vào, nên URL tuyệt đối phải là địa chỉ HOST nhìn
      # thấy — không phải tên service trong mạng compose.
      - 'NEWS_PUBLIC_BASE_URL=http://localhost:8080'
    depends_on:
      floci:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_healthy
